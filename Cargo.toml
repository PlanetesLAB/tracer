[package]
name = "tracer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
fitsio = { version = "0.21.10", features = ["array"] }
flate2 = "1.1.2"
ndarray = "0.17.2"
rand = "0.9.2"
rayon = "1.11.0"
spectre = { git = "https://github.com/ProsiaLAB/spectre.git" }
codata = "0.1.0"
prosia-extensions = "0.1.12"

[profile.release]
lto = true        # Link-time optimization
codegen-units = 1 # Slower build times, but more optimization
opt-level = 3     # Highest optimization level
